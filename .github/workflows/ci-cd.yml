name: Task-tracker API CI/CD

on:
  push:
    branches:
      - main
      - feature/* 
  pull_request:
    branches: 
      - main
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        
        ports:
          - 5432:5432
        
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Init data base
        run: |
          docker run --net=host --rm -v ${{ github.workspace }}/data_base/init_db.sql:/tmp/init_db.sql \
          -e PGPASSWORD=password postgres:16-alpine \
          psql -h 127.0.0.1 -U test_user -d test_db -f /tmp/init_db.sql

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linter on base flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with pytest
        env:
          TEST_DATABASE_URL: postgresql://test_user:password@127.0.0.1:5432/test_db
        run: pytest

  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-api:${{ github.sha }}

  terraform-provicion:
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    env: 
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/terraform/.terraformrc
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_service_account_key_file: ${{ github.workspace }}/terraform/key.json
      TF_VAR_ssh_public_key_path: ${{ github.workspace }}/terraform/ssh_key.pub

    outputs:
        server_public_ip: ${{ steps.tf_output.outputs.server_public_ip }}
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.15.9'
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init

      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate
        run: terraform validate

      - name: Write YC service account key
        run: echo '${{ secrets.YC_KEY_FILE }}' > ${{ github.workspace }}/terraform/key.json

      - name: Write SSH public key
        run: echo '${{ secrets.SSH_PUBLIC_KEY }}' > ${{ github.workspace }}/terraform/ssh_key.pub

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve "tfplan"

      - name: Cleanup service account key
        if: always()
        run: rm -f ${{ github.workspace }}/terraform/key.json

      - name: Cleanup ssh pub key
        if: always()
        run: rm -f ${{ github.workspace }}/terraform/ssh_key.pub

      - name: Terraform output
        id: tf_output
        run: echo "server_public_ip=$(terraform output -raw server_public_ip)" >> $GITHUB_OUTPUT

  ansible-configure-deploy:
    runs-on: ubuntu-latest
    needs: terraform-provicion

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Ansible
        run: pip install ansible=='14.3.1'

      - name: Configure SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY}}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Waiting for SSH on ${{ needs.terraform-provicion.outputs.server_public_ip }}..."
          for i in {1..30}; do
            if ssh-keyscan -H ${{ needs.terraform-provicion.outputs.server_public_ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH is up"
              break
            fi
            echo "Not ready yet, retry $i/30..."
            sleep 10
          done
      
      - name: Run Ansible playbook
        run: |
          ansible-playbook -i "${{ needs.terraform-provicion.outputs.server_public_ip}}," \
          --user "${{ secrets.SERVER_SSH_USER }}" \
          --private-key ~/.ssh/deploy_key \
          install_docker.yml

      - name: Deploy application
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          ansible-playbook -i "${{ needs.terraform-provicion.outputs.server_public_ip }}," \
          --user "${{ secrets.SERVER_SSH_USER }}" \
          --private-key ~/.ssh/deploy_key \
          --extra-vars "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }} DATABASE_URL=${{ secrets.DATABASE_URL }} \
          POSTGRES_USER=${{ secrets.POSTGRES_USER }} POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
          POSTGRES_DB=${{ secrets.POSTGRES_DB }} GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }} \
          GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
          deploy.yml