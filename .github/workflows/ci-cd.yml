name: Task-tracker API CI/CD

on:
  push:
    branches:
      - feature/* 
  pull_request:
    branches: 
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres_db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        
        ports:
          - 5432:5432
        
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Init data base
        env:
          PGPASSWORD: password
        run: |
          docker run --net=host --rm -v ${{ github.workspace }}/data_base/init_db.sql:/tmp/init_db.sql postgres:16-alpine psql -h localhost -U test_user -d test_db -f /tmp/init_db.sql

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linter on base flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with pytest
        env:
          TEST_DATABASE_URL: postgresql://test_user:password@localhost:5432/test_db
        run: pytest

  build-and-push-docker:
    runs-on: ubuntu-latest

    needs: lint-and-test

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/task-tracker-api:latest