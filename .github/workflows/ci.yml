name: Task-tracker API CI

on:
  push:
    branches: [ main ]

jobs:
  test-environment:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code from repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check Python version
        run: python --version